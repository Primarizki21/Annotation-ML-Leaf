<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patch Annotation</title>
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="annotator-name" id="annotatorName">{{ annotator_name }}</span>
            <span class="progress-text" id="progressText"></span>
        </div>
        <div class="header-right">
            <button id="reviewBtn" class="btn-link" style="display:none">Review Disputed</button>
            <button id="alBtn" class="btn-link" style="display:none">Active Learning</button>
            <a href="/dashboard" class="btn-link">Dashboard</a>
        </div>
    </div>

    <!-- Flash notification -->
    <div class="flash" id="flash"></div>

    <!-- Review banner -->
    <div id="reviewBanner" class="review-banner hidden">Mode Review &mdash; Patch ini perlu didiskusikan ulang. Pastikan Anda membaca pedoman anotasi terbaru.</div>

    <!-- Active Learning banner -->
    <div id="alBanner" class="review-banner hidden" style="background:#1f4e79;">Active Learning &mdash; Round <span id="alRound">?</span>: verifikasi pseudo-label &amp; label HITL</div>

    <!-- Main content -->
    <div class="main" id="mainContent">
        <div class="loading">Loading...</div>
    </div>

    <!-- Setup modal -->
    <div class="modal-overlay" id="setupModal">
        <div class="modal">
            <h2>Welcome</h2>
            <p>Enter your name to start annotating</p>
            <div class="error-msg" id="setupError"></div>
            <input type="text" id="nameInput" placeholder="Your name" autocomplete="off">
            <button class="btn btn-healthy" id="setupBtn">Start Annotating</button>
        </div>
    </div>

    <script type="module" src="/static/js/index.js"></script>
</body>
</html>
