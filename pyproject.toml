[project]
name = "anotasiprogramml"
version = "0.1.0"
description = "Image patch annotation app for plant disease detection ML"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "python-multipart>=0.0.30",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
ml = [
    "matplotlib>=3.8.0",
    "numpy>=2.4.6",
    "scikit-learn>=1.5.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
